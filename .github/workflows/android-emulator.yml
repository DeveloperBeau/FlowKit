# Runs FlowKit's non-UI suites on a real Android runtime, in an x86_64 emulator
# under KVM. This is the only place any FlowKit code is EXECUTED on Android; the
# `android` job in ci.yml only cross-compiles.
#
# Deliberately scheduled rather than per-PR, and deliberately in its own file:
# the suite is wall-clock-timing-sensitive and an emulated device on a shared
# runner is slower and noisier than the iOS Simulator, so a red run here must
# never stand between a correct change and a merge. Having no `pull_request`
# trigger is what makes that true — it cannot report a check on a PR, so it
# cannot end up in branch protection's required list by accident.
#
# `continue-on-error` is deliberately NOT used. It would make the workflow run
# conclude green when the job fails, which is how a non-blocking job becomes a
# row of green ticks that proves nothing. A failure here is a red run in the
# Actions tab and a failure email from GitHub to the repository owner.
#
# Note: GitHub disables scheduled workflows after 60 days without a commit to
# the repository. If this stops appearing, re-enable it from the Actions tab.
name: Android Emulator

on:
  schedule:
    # 06:00 UTC — 14:00 +08, so a failure email lands during the working day
    # rather than overnight.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator
  cancel-in-progress: true

jobs:
  emulator:
    name: Android Emulator (API 28, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8  # v2.9.5
        with:
          swift-version: '6.3.3'
          # Must be the NDK's numeric directory version, not its release name:
          # the action resolves it with `ls $ANDROID_NDK_HOME/../<value>*`, and the
          # runner installs NDKs under numeric names. 'r27d' matched nothing, which
          # left ANDROID_NDK_HOME empty and failed the SDK setup script. '27' is
          # r27d (27.3.13750724) on the current image and tolerates a patch bump.
          ndk-version: '27'
          android-api-level: 28
          # debug, not release: `swift build --build-tests -c release` fails outright
          # on this package (module not compiled for testing), and forcing testability
          # in release with `-Xswiftc -enable-testing` segfaults the Apple toolchain's
          # SIL optimizer instead — a pre-existing project bug, unrelated to Android,
          # not something this job works around. debug is the config that demonstrably
          # builds. See the changes file for the full finding and reproduction.
          swift-configuration: debug
          free-disk-space: true
          # FLOWKIT_TIMEOUT_SCALE widens FlowTesting's wall-clock HANG DETECTORS.
          # It is not a performance assertion: a passing test never waits out a
          # timeout, so a too-large value costs nothing on green runs. 12 was already
          # a guess against a release build; debug is slower at runtime than release
          # would have been, so this guess is now less certain, not more. Do not raise
          # it without a measurement — the first scheduled runs are the measurement.
          test-env: 'FLOWKIT_TIMEOUT_SCALE=12'
          # Same eight suites as the linux job in ci.yml, so that a red Android
          # run against a green Linux run isolates the platform rather than the
          # suite selection.
          swift-test-flags: >-
            --filter FlowSharedModelsTests
            --filter FlowCoreTests
            --filter FlowOperatorsTests
            --filter FlowHotStreamsTests
            --filter FlowTestClockTests
            --filter FlowTestingCoreTests
            --filter FlowPublicAPITests
            --filter FlowTestingPublicAPITests
