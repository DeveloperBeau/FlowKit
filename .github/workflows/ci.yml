name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: DeveloperBeau/resolve-swift@95dd7376c9df6efd1252713de2edbc4ae6df0663  # v1
        with:
          swift-version: '6.3'
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build -j 2
      - name: Test with coverage
        run: swift test -j 2 --enable-code-coverage
      - name: Coverage report
        run: |
          BIN=$(find .build -name "FlowKitPackageTests.xctest" -type d | head -1)
          PROF=$(find .build -name "default.profdata" | head -1)
          if [ -n "$BIN" ] && [ -n "$PROF" ]; then
            xcrun llvm-cov report "$BIN/Contents/MacOS/FlowKitPackageTests" \
              -instr-profile="$PROF" \
              -ignore-filename-regex='Tests/|.build/'
          fi

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: DeveloperBeau/resolve-swift@95dd7376c9df6efd1252713de2edbc4ae6df0663  # v1
        with:
          swift-version: '6.3'
      - name: Show Swift version
        run: swift --version
      - name: Build non-UI targets (release config)
        run: swift build -j 2 -c release --target Flow --target FlowTesting
      - name: Test non-UI targets (release config)
        run: |
          swift test -j 2 -c release \
            --filter FlowSharedModelsTests \
            --filter FlowCoreTests \
            --filter FlowOperatorsTests \
            --filter FlowHotStreamsTests \
            --filter FlowTestClockTests \
            --filter FlowTestingCoreTests \
            --filter FlowPublicAPITests \
            --filter FlowTestingPublicAPITests

  # Cross-compiles only. A cross-compiled Android binary cannot execute on the
  # Linux host and there is no emulator here, so this job proves the package
  # BUILDS for Android — it does not run a single FlowKit test on Android. The
  # nightly android-emulator.yml workflow is what exercises the runtime, and it
  # deliberately does not gate merges.
  #
  # The Swift SDK for Android requires an open-source host toolchain whose
  # version matches the SDK bundle EXACTLY. resolve-swift short-circuits on a
  # prefix match, so '6.3' could leave a 6.3.1 image toolchain in place against
  # a 6.3.3 bundle; the pin below is exact and the next step asserts it, because
  # the mismatch surfaces as an unrelated-looking module-format error.
  android:
    name: Android (cross-compile)
    runs-on: ubuntu-latest
    env:
      SWIFT_VERSION: '6.3.3'
      ANDROID_SDK_URL: 'https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz'
      ANDROID_SDK_CHECKSUM: 'd160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5'
      NDK_VERSION: 'r27d'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: DeveloperBeau/resolve-swift@95dd7376c9df6efd1252713de2edbc4ae6df0663  # v1
        with:
          swift-version: '6.3.3'
      - name: Show Swift version
        run: swift --version
      # Substring match anchored on the literal "Swift version " prefix. Safe
      # while the pin is 6.3.3, which is not a prefix of any other release; if
      # the pin ever becomes one that is (e.g. 6.4 vs 6.4.1), add a trailing
      # space inside the quotes.
      - name: Require exact toolchain match
        run: |
          swift --version 2>&1 | grep -q "Swift version ${SWIFT_VERSION}" || {
            echo "::error::Swift SDK for Android ${SWIFT_VERSION} needs host toolchain ${SWIFT_VERSION}"
            swift --version
            exit 1
          }
      - name: Install Swift SDK for Android
        run: |
          swift sdk install "$ANDROID_SDK_URL" --checksum "$ANDROID_SDK_CHECKSUM"
          swift sdk list
      - name: Install and configure Android NDK
        run: |
          set -euo pipefail
          # SwiftPM's data directory is host-specific: ~/.swiftpm on macOS, the
          # XDG data path on Linux. `swift sdk install` has no flag to pin it
          # and no command reports it back, so probe both roots rather than
          # hardcode one and rediscover this the next time a runner changes.
          BUNDLE="swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle/swift-android"
          for root in "$HOME/.swiftpm/swift-sdks" \
                      "${XDG_DATA_HOME:-$HOME/.local/share}/org.swift.swiftpm/swift-sdks"; do
            if [ -d "$root/$BUNDLE" ]; then SDK_DIR="$root/$BUNDLE"; break; fi
          done
          [ -n "${SDK_DIR:-}" ] || {
            echo "::error::installed Android SDK bundle not found under any known SwiftPM data directory"
            exit 1
          }
          cd "$SDK_DIR"
          curl -fSL --retry 3 --retry-all-errors -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -qo ndk.zip
          ANDROID_NDK_HOME="$PWD/android-ndk-${NDK_VERSION}" ./scripts/setup-android-sdk.sh
      - name: Cross-compile non-UI targets (release config)
        run: |
          set -euo pipefail
          # The arch strings are what `file` prints for an Android ELF object,
          # written out here by hand so the check has a source independent of the
          # build that produced the object.
          check() {
            triple="$1"; expected="$2"
            echo "::group::$triple"
            swift build -j 2 -c release --swift-sdk "$triple" --target Flow --target FlowTesting
            obj="$(find ".build/$triple/release" -name '*.o' -print -quit)"
            [ -n "$obj" ] || { echo "::error::no objects under .build/$triple/release — did --swift-sdk apply?"; exit 1; }
            echo "$obj"
            file "$obj"
            file "$obj" | grep -q "$expected" || {
              echo "::error::$obj is not $expected — built for the wrong architecture"
              exit 1
            }
            echo "::endgroup::"
          }
          check aarch64-unknown-linux-android28 'ARM aarch64'
          check x86_64-unknown-linux-android28 'x86-64'

  # The only simulator that runs the tests. The other Apple platforms share
  # this exact simulator runtime environment (same host kernel, same Swift
  # runtime), so running the suite on each adds sim-boot flakiness and runner
  # queueing without adding coverage; they get compile coverage below instead.
  ios:
    name: iOS (Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install iOS simulator runtime
        run: |
          sudo xcodebuild -runFirstLaunch
          for i in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then exit 0; fi
            echo "downloadPlatform attempt $i failed; sleeping before retry"
            sleep 15
          done
          exit 1
      - name: Test iOS Simulator (with coverage)
        env:
          # Constrained runner: widen FlowTesting wall-clock timeouts so
          # executor backlog under full-parallel suites cannot blow hang
          # detectors on tests that pass locally in milliseconds. xcodebuild
          # forwards TEST_RUNNER_-prefixed variables to the test process.
          TEST_RUNNER_FLOWKIT_TIMEOUT_SCALE: "6"
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '
                [.devices | to_entries[] | select(.key | test("iOS-"))
                  | {runtime: .key, devices: .value}]
                | sort_by(.runtime) | reverse[] | .devices[]
                | select(.isAvailable and (.name | startswith("iPhone ")))
                | .udid
              ' | head -1)
          [ -n "$UDID" ] || { echo "No iPhone simulator found"; exit 1; }
          echo "Using simulator UDID: $UDID"
          xcrun simctl list devices --json | jq -r --arg u "$UDID" '
            .devices | to_entries[] | .value[] | select(.udid == $u) | "\(.name) on \(.deviceTypeIdentifier)"'
          xcodebuild test \
            -scheme FlowKit-Package \
            -destination "platform=iOS Simulator,id=$UDID" \
            -enableCodeCoverage YES \
            -derivedDataPath .build-ios \
            -resultBundlePath .build-ios/Result.xcresult
      - name: Coverage report
        if: always()
        run: |
          [ -d .build-ios ] || { echo "No .build-ios; skipping coverage"; exit 0; }
          PROF=$(find .build-ios -name "Coverage.profdata" | head -1)
          if [ -n "$PROF" ]; then
            ARGS=()
            for x in .build-ios/Build/Products/Debug-iphonesimulator/*.xctest; do
              name=$(basename "$x" .xctest)
              bin="$x/$name"
              [ -f "$bin" ] && ARGS+=(-object "$bin")
            done
            xcrun llvm-cov report "${ARGS[@]}" \
              -instr-profile="$PROF" \
              -ignore-filename-regex='Tests/|.build/|checkouts/|DerivedSources/'
          fi

  # Compile the package and its tests against the remaining Apple SDKs. This
  # catches API-availability breaks and watchOS's arm64_32 pointer width
  # without booting a simulator or running the suite, which is where the
  # per-platform jobs spent their time and produced their flakes. One runner,
  # three sequential builds; the platform downloads are cached on the image.
  build-other-platforms:
    name: Build tvOS / watchOS / visionOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Install platform SDKs
        run: |
          sudo xcodebuild -runFirstLaunch
          for platform in tvOS watchOS visionOS; do
            downloaded=false
            for i in 1 2 3; do
              if xcodebuild -downloadPlatform "$platform"; then downloaded=true; break; fi
              echo "downloadPlatform $platform attempt $i failed; sleeping before retry"
              sleep 15
            done
            [ "$downloaded" = true ] || exit 1
          done
      - name: Build for tvOS Simulator
        run: |
          xcodebuild build-for-testing \
            -scheme FlowKit-Package \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath .build-tvos
      - name: Build for watchOS Simulator
        run: |
          xcodebuild build-for-testing \
            -scheme FlowKit-Package \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath .build-watchos
      - name: Build for visionOS Simulator
        run: |
          xcodebuild build-for-testing \
            -scheme FlowKit-Package \
            -destination "generic/platform=visionOS Simulator" \
            -derivedDataPath .build-visionos
